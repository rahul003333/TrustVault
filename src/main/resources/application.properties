
# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/trustvault}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Database behavior: update is retained for local development.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# Server
server.port=${PORT:8082}

# Logging: avoid verbose security logs by default.
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:INFO}

# Upload limits
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB
